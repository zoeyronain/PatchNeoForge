syntax = "proto3";

package patchneoforge.sound;

import "patchneoforge/common/types.proto";

option java_multiple_files = true;
option java_package = "patchneoforge.sound";

message Sound {
  string name = 1;
  string category = 2;
}

message PlayerEntityPlaySoundRequest {
  patchneoforge.common.UUID player_uuid = 1;
  Sound sound = 2;
  patchneoforge.common.UUID entity_uuid = 3;
  float volume = 4;
  float pitch = 5;
  optional int64 seed = 6;
}

message PlayerPlaySoundRequest {
  patchneoforge.common.UUID player_uuid = 1;
  Sound sound = 2;
  patchneoforge.common.Location location = 3;
  float volume = 4;
  float pitch = 5;
  optional int64 seed = 6;
}
