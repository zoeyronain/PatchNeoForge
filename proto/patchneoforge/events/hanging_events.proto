syntax = "proto3";
package patchneoforge.events;

import "patchneoforge/common/types.proto";

option java_multiple_files = true;
option java_package = "patchneoforge.events";

message HangingBreakEvent {
  patchneoforge.common.UUID entity_uuid = 1;
  patchneoforge.common.UUID remover_uuid = 2;
}

message HangingBreakByEntityEvent {
  patchneoforge.common.UUID entity_uuid = 1;
  patchneoforge.common.UUID remover_uuid = 2;
}

message HangingPlaceEvent {
  patchneoforge.common.UUID entity_uuid = 1;
  patchneoforge.common.UUID player_uuid = 2;
  int32 block_x = 3;
  int32 block_y = 4;
  int32 block_z = 5;
  string block_face = 6;
}
