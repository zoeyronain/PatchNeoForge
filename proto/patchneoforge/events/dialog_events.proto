syntax = "proto3";
package patchneoforge.events;

import "patchneoforge/common/types.proto";

option java_multiple_files = true;
option java_package = "patchneoforge.events";

message DialogClearEvent {
  patchneoforge.common.UUID player_uuid = 1;
}

message DialogClickActionEvent {
  patchneoforge.common.UUID player_uuid = 1;
  string id = 2;
  bytes payload = 3;
}

message DialogShowEvent {
  patchneoforge.common.UUID player_uuid = 1;
}
