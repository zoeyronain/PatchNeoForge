syntax = "proto3";

package patchneoforge.config;

import "patchneoforge/common/types.proto";

option java_multiple_files = true;
option java_package = "patchneoforge.config";

message GetPatchNeoForgeConfigResponse {
  string minimum_supported_plugin_api = 1;
  repeated string disabled_plugins = 2;
  bool download_dependencies = 3;
  bool warn_unimplemented_api = 4;
  bool debug_bridge = 5;
  string log_level = 6;
}
